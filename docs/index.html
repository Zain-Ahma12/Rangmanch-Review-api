
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">

  <title>Swagger UI Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
    }

    p {
      color: #8b949e;
      line-height: 1.6;
    }

    .video-container {
      margin-top: 28px;
      overflow: hidden;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #010409;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9rem;
    }

    a {
      color: #58a6ff;
    }
  </style>
</head>

<body>
  <main>
    <h1>Swagger UI Demo</h1>
    <p>
      Watch the API documentation interface in action.
    </p>

    <div class="video-container">
      <video
        controls
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        aria-label="Swagger UI demonstration">

        <source
          src="./Swagger_ui_show.mp4"
          type="video/mp4">

        Your browser does not support HTML5 video.
      </video>
    </div>

    <p class="footer">
      <a href="https://github.com">
        Powered by GitHub Pages
      </a>
    </p>
  </main>
</body>
</html>
